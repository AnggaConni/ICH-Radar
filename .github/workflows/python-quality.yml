name: Python Quality Checks

on:
  push:
    branches:
      - "fix/**"
      - main
  pull_request:
    branches:
      - main

jobs:
  resource-intelligence-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install runtime dependency
        run: python -m pip install requests
      - name: Compile Python modules
        run: python -m py_compile scraper.py keyword_database.py resource_intelligence.py
      - name: Check Resource Intelligence inline JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("radar.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\\b[^>]*>(.*?)</script\\s*>", html, flags=re.I | re.S)
          app_script = next((script for script in scripts if "function renderResourceOpportunity(itemId)" in script), None)
          if app_script is None:
              raise SystemExit("Could not find the Radar application inline script")
          Path("/tmp/ich-radar-inline.js").write_text(app_script, encoding="utf-8")
          PY
          node --check /tmp/ich-radar-inline.js
      - name: Run resource intelligence tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
