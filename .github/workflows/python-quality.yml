name: Python Quality Checks

on:
  push:
    branches:
      - "fix/**"
      - main
  pull_request:
    branches:
      - main

jobs:
  resource-intelligence-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install runtime dependency
        run: python -m pip install requests
      - name: Compile Python modules
        run: python -m py_compile scraper.py keyword_database.py resource_intelligence.py
      - name: Run resource intelligence tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
