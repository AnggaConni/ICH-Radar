name: ICH Shared Heritage Auto-Crawler

on:
  schedule:
    # Run every day. Scheduled runs alternate:
    # Odd UTC day-of-year  -> discovery + standard data enrichment
    # Even UTC day-of-year -> Resource & Opportunity enrichment
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      crawl_mode:
        description: 'Choose what to run'
        required: true
        default: 'Data only'
        type: choice
        options:
          - 'Data only'
          - 'Resource enrichment'
          - 'Resume only'
          - 'Both'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-scraper-and-ai:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Select daily pipeline
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ inputs.crawl_mode }}" in
              "Data only")
                echo "CRAWL_MODE_INPUT=data_only" >> "$GITHUB_ENV"
                ;;
              "Resource enrichment")
                echo "CRAWL_MODE_INPUT=resource_enrich" >> "$GITHUB_ENV"
                ;;
              "Resume only")
                echo "CRAWL_MODE_INPUT=resume_only" >> "$GITHUB_ENV"
                ;;
              "Both")
                echo "CRAWL_MODE_INPUT=both" >> "$GITHUB_ENV"
                ;;
              *)
                echo "Unknown manual crawl mode."
                exit 1
                ;;
            esac
          else
            DAY_OF_YEAR=$(date -u +%j)
            DAY_NUMBER=$((10#${DAY_OF_YEAR}))
            if (( DAY_NUMBER % 2 == 1 )); then
              echo "CRAWL_MODE_INPUT=data_only" >> "$GITHUB_ENV"
              echo "Scheduled mode: DATA DISCOVERY / STANDARD ENRICHMENT"
            else
              echo "CRAWL_MODE_INPUT=resource_enrich" >> "$GITHUB_ENV"
              echo "Scheduled mode: RESOURCE & OPPORTUNITY ENRICHMENT"
            fi
          fi

      - name: Run Scraper & Gemini AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Running scraper with CRAWL_MODE=$CRAWL_MODE_INPUT"
          CRAWL_MODE="$CRAWL_MODE_INPUT" python scraper.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add data.json history.json resume.json || true

          if git diff --staged --quiet; then
            echo "No new data to commit."
          else
            git commit -m "ICH Update: alternating discovery & resource intelligence [skip ci]"

            # Another workflow/manual edit can update main while this job is running.
            # Rebase our generated commit on the latest remote main before pushing.
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                echo "Push succeeded on attempt $attempt."
                exit 0
              fi

              echo "Push rejected; rebasing on latest origin/main (attempt $attempt)."
              git fetch origin main
              git rebase origin/main || {
                echo "Rebase conflict detected. The generated changes cannot be auto-merged safely."
                git rebase --abort || true
                exit 1
              }
            done

            echo "Push failed after 3 attempts."
            exit 1
          fi
