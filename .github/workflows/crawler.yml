name: ICH Shared Heritage Auto-Crawler

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      crawl_mode:
        description: 'Choose what to run'
        required: true
        default: 'Data only'
        type: choice
        options:
          - 'Data only'
          - 'Resource enrichment'
          - 'Free Discovery (Experimental)'
          - 'Inventory Quality Audit (Read-only)'
          - 'Thumbnail Enrichment (Direct URLs)'
          - 'ALL (Full Pipeline)'
      data_enrich_limit:
        description: 'Incomplete records to enrich in Data only mode (1–10)'
        required: true
        default: 1
        type: number
      data_discovery_limit:
        description: 'New heritage records Gemini may discover in Data only mode (1–10)'
        required: true
        default: 1
        type: number
      resource_enrich_limit:
        description: 'Records to enrich in Resource enrichment mode (1–10)'
        required: true
        default: 1
        type: number
      free_discovery_ai_limit:
        description: 'Maximum Gemini calls in Free Discovery (identity extraction + merging, 0–20)'
        required: true
        default: 2
        type: number
      deepseek_promotion_limit:
        description: 'Maximum article-backed Discovery records to promote into Main Archive (1–10; ALL only)'
        required: true
        default: 2
        type: number
      thumbnail_enrich_limit:
        description: 'Existing main inventory records to enrich with direct thumbnail URLs (1–25)'
        required: true
        default: 5
        type: number

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-scraper-and-ai:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Validate inputs and select pipeline
        shell: bash
        env:
          MODE_INPUT: ${{ inputs.crawl_mode }}
          DATA_ENRICH_INPUT: ${{ inputs.data_enrich_limit }}
          DATA_DISCOVERY_INPUT: ${{ inputs.data_discovery_limit }}
          RESOURCE_ENRICH_INPUT: ${{ inputs.resource_enrich_limit }}
          FREE_AI_INPUT: ${{ inputs.free_discovery_ai_limit }}
          DEEPSEEK_PROMOTE_INPUT: ${{ inputs.deepseek_promotion_limit }}
          THUMBNAIL_LIMIT_INPUT: ${{ inputs.thumbnail_enrich_limit }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            validate_range() {
              local value="$1" name="$2" min="$3" max="$4"
              if ! [[ "$value" =~ ^[0-9]+$ ]]; then echo "$name must be a whole number."; exit 1; fi
              value=$((10#$value))
              if (( value < min || value > max )); then echo "$name must be between $min and $max."; exit 1; fi
              echo "$value"
            }
            DATA_ENRICH_LIMIT=$(validate_range "${DATA_ENRICH_INPUT:-1}" "Data enrichment limit" 1 10)
            DATA_DISCOVERY_LIMIT=$(validate_range "${DATA_DISCOVERY_INPUT:-1}" "Data discovery limit" 1 10)
            RESOURCE_ENRICH_LIMIT=$(validate_range "${RESOURCE_ENRICH_INPUT:-1}" "Resource enrichment limit" 1 10)
            FREE_DISCOVERY_AI_LIMIT=$(validate_range "${FREE_AI_INPUT:-2}" "Free Discovery AI limit" 0 20)
            DEEPSEEK_PROMOTION_LIMIT=$(validate_range "${DEEPSEEK_PROMOTE_INPUT:-2}" "DeepSeek promotion limit" 1 10)
            THUMBNAIL_ENRICH_LIMIT=$(validate_range "${THUMBNAIL_LIMIT_INPUT:-5}" "Thumbnail enrichment limit" 1 25)
            echo "DATA_ENRICH_LIMIT=$DATA_ENRICH_LIMIT" >> "$GITHUB_ENV"
            echo "DATA_DISCOVERY_LIMIT=$DATA_DISCOVERY_LIMIT" >> "$GITHUB_ENV"
            echo "RESOURCE_ENRICH_LIMIT=$RESOURCE_ENRICH_LIMIT" >> "$GITHUB_ENV"
            echo "FREE_DISCOVERY_AI_LIMIT=$FREE_DISCOVERY_AI_LIMIT" >> "$GITHUB_ENV"
            echo "DEEPSEEK_PROMOTION_LIMIT=$DEEPSEEK_PROMOTION_LIMIT" >> "$GITHUB_ENV"
            echo "THUMBNAIL_ENRICH_LIMIT=$THUMBNAIL_ENRICH_LIMIT" >> "$GITHUB_ENV"
            echo "Manual limits: data enrichment=$DATA_ENRICH_LIMIT; new discovery=$DATA_DISCOVERY_LIMIT; resource enrichment=$RESOURCE_ENRICH_LIMIT; free discovery Gemini identity attempts=$FREE_DISCOVERY_AI_LIMIT."
            case "$MODE_INPUT" in
              "Data only") echo "PIPELINE=data_only" >> "$GITHUB_ENV" ;;
              "Resource enrichment") echo "PIPELINE=resource_enrich" >> "$GITHUB_ENV" ;;
              "Free Discovery (Experimental)") echo "PIPELINE=free_discovery" >> "$GITHUB_ENV" ;;
              "Inventory Quality Audit (Read-only)") echo "PIPELINE=inventory_audit" >> "$GITHUB_ENV" ;;
              "Thumbnail Enrichment (Direct URLs)") echo "PIPELINE=thumbnail_enrich" >> "$GITHUB_ENV" ;;
              "ALL (Full Pipeline)") echo "PIPELINE=all" >> "$GITHUB_ENV" ;;
              *) echo "Unknown mode."; exit 1 ;;
            esac
          else
            echo "PIPELINE=scheduled_auto" >> "$GITHUB_ENV"
            echo "DATA_ENRICH_LIMIT=2" >> "$GITHUB_ENV"
            echo "DATA_DISCOVERY_LIMIT=3" >> "$GITHUB_ENV"
            echo "RESOURCE_ENRICH_LIMIT=1" >> "$GITHUB_ENV"
            echo "FREE_DISCOVERY_AI_LIMIT=0" >> "$GITHUB_ENV"
            echo "DEEPSEEK_PROMOTION_LIMIT=1" >> "$GITHUB_ENV"
            echo "Scheduled run: Main ICH discovery/enrichment + autonomous RSS preservation."
          fi

      - name: Validate Python syntax
        run: python -m py_compile scraper.py free_discovery.py web_search_discovery.py evidence_search.py test_scraper_no_grounding.py test_free_discovery.py test_web_search_discovery.py resource_intelligence.py inventory_quality_audit.py test_inventory_quality_audit.py thumbnail_enrichment.py test_thumbnail_enrichment.py

      - name: Run offline aggregator safety tests
        run: python -m unittest -v test_scraper_no_grounding.py test_free_discovery.py test_web_search_discovery.py test_inventory_quality_audit.py test_thumbnail_enrichment.py

      - name: Run selected pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          YOUCOM_API_KEY: ${{ secrets.YOUCOM_API_KEY }}
        shell: bash
        run: |
          set -e
          if [ "$PIPELINE" = "all" ]; then
            echo "=== STAGE 1/3: DATA ONLY ==="
            CRAWL_MODE=data_only DATA_ENRICH_LIMIT="$DATA_ENRICH_LIMIT" DATA_DISCOVERY_LIMIT="$DATA_DISCOVERY_LIMIT" python scraper.py
            echo "=== STAGE 2/3: RESOURCE ENRICHMENT ==="
            CRAWL_MODE=resource_enrich RESOURCE_ENRICH_LIMIT="$RESOURCE_ENRICH_LIMIT" python scraper.py
            echo "=== STAGE 3/4: MULTI-PROVIDER WEB SEARCH ==="
            python web_search_discovery.py
            echo "=== STAGE 4/4: RSS PRESERVATION + PROMOTION ==="
            PROMOTE_TO_MAIN_ARCHIVE=1 DEEPSEEK_PROMOTION_LIMIT="$DEEPSEEK_PROMOTION_LIMIT" FREE_DISCOVERY_AI_LIMIT="$FREE_DISCOVERY_AI_LIMIT" python free_discovery.py
          elif [ "$PIPELINE" = "thumbnail_enrich" ]; then
            echo "Direct-thumbnail enrichment for existing main inventory (no AI calls)."
            THUMBNAIL_ENRICH_LIMIT="$THUMBNAIL_ENRICH_LIMIT" python thumbnail_enrichment.py
          elif [ "$PIPELINE" = "inventory_audit" ]; then
            echo "Read-only quality audit of existing data.json inventory."
            python inventory_quality_audit.py
          elif [ "$PIPELINE" = "free_discovery" ]; then
            echo "Free Discovery: multi-provider web search + RSS feeds."
            python web_search_discovery.py
            FREE_DISCOVERY_AI_LIMIT="$FREE_DISCOVERY_AI_LIMIT" python free_discovery.py
          elif [ "$PIPELINE" = "scheduled_auto" ]; then
            echo "=== SCHEDULED STAGE 1/2: MAIN ICH DISCOVERY + ENRICHMENT ==="
            CRAWL_MODE=data_only DATA_ENRICH_LIMIT="$DATA_ENRICH_LIMIT" DATA_DISCOVERY_LIMIT="$DATA_DISCOVERY_LIMIT" python scraper.py
            echo "=== SCHEDULED STAGE 2/3: MULTI-PROVIDER WEB DISCOVERY ==="
            python web_search_discovery.py
            echo "=== SCHEDULED STAGE 3/3: RSS PRESERVATION + PROMOTION ==="
            PROMOTE_TO_MAIN_ARCHIVE=1 DEEPSEEK_PROMOTION_LIMIT="$DEEPSEEK_PROMOTION_LIMIT" FREE_DISCOVERY_AI_LIMIT=0 python free_discovery.py
          else
            CRAWL_MODE="$PIPELINE" DATA_ENRICH_LIMIT="$DATA_ENRICH_LIMIT" DATA_DISCOVERY_LIMIT="$DATA_DISCOVERY_LIMIT" RESOURCE_ENRICH_LIMIT="$RESOURCE_ENRICH_LIMIT" python scraper.py
          fi

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Stage optional outputs only when they exist; missing report files must not abort git add.
          for file in data.json history.json free_discovery_candidates.json web_search_discovery_summary.json inventory_quality_report.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          for file in data[1-9]*.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if git diff --staged --quiet; then
            echo "No new data to commit."
          else
            git commit -m "ICH Update: pipeline data changes [skip ci]"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then echo "Push succeeded on attempt $attempt."; exit 0; fi
              echo "Push rejected; rebasing (attempt $attempt)."
              git fetch origin main
              git rebase origin/main || { git rebase --abort || true; exit 1; }
            done
            echo "Push failed after 3 attempts."; exit 1
          fi
