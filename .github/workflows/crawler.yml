name: ICH Shared Heritage Auto-Crawler

on:
  schedule:
    # Run every day. Scheduled runs alternate by absolute UTC day:
    # One day -> discovery + standard data enrichment
    # Next day -> Resource & Opportunity enrichment
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      crawl_mode:
        description: 'Choose what to run'
        required: true
        default: 'Data only'
        type: choice
        options:
          - 'Data only'
          - 'Resource enrichment'
          - 'Resume only'
          - 'Both'
      resource_enrich_limit:
        description: 'Records to enrich in Resource enrichment mode (1–10)'
        required: true
        default: 2
        type: number

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-scraper-and-ai:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Select daily pipeline
        shell: bash
        env:
          RESOURCE_ENRICH_LIMIT_INPUT: ${{ inputs.resource_enrich_limit }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RESOURCE_ENRICH_LIMIT_INPUT="${RESOURCE_ENRICH_LIMIT_INPUT:-2}"
            if ! [[ "$RESOURCE_ENRICH_LIMIT_INPUT" =~ ^[0-9]+$ ]]; then
              echo "Resource enrichment record count must be a whole number from 1 to 10."
              exit 1
            fi
            RESOURCE_ENRICH_LIMIT_INPUT=$((10#$RESOURCE_ENRICH_LIMIT_INPUT))
            if (( RESOURCE_ENRICH_LIMIT_INPUT < 1 || RESOURCE_ENRICH_LIMIT_INPUT > 10 )); then
              echo "Resource enrichment record count must be between 1 and 10."
              exit 1
            fi
            echo "RESOURCE_ENRICH_LIMIT=$RESOURCE_ENRICH_LIMIT_INPUT" >> "$GITHUB_ENV"
            echo "Manual resource enrichment batch size: $RESOURCE_ENRICH_LIMIT_INPUT record(s)."
            case "${{ inputs.crawl_mode }}" in
              "Data only")
                echo "CRAWL_MODE_INPUT=data_only" >> "$GITHUB_ENV"
                ;;
              "Resource enrichment")
                echo "CRAWL_MODE_INPUT=resource_enrich" >> "$GITHUB_ENV"
                ;;
              "Resume only")
                echo "CRAWL_MODE_INPUT=resume_only" >> "$GITHUB_ENV"
                ;;
              "Both")
                echo "CRAWL_MODE_INPUT=both" >> "$GITHUB_ENV"
                ;;
              *)
                echo "Unknown manual crawl mode."
                exit 1
                ;;
            esac
          else
            # Use absolute UTC days since Unix epoch so the pipeline keeps
            # alternating correctly across month/year boundaries.
            EPOCH_DAY=$(( $(date -u +%s) / 86400 ))
            if (( EPOCH_DAY % 2 == 0 )); then
              echo "CRAWL_MODE_INPUT=data_only" >> "$GITHUB_ENV"
              echo "Scheduled mode: DATA DISCOVERY / STANDARD ENRICHMENT"
            else
              echo "CRAWL_MODE_INPUT=resource_enrich" >> "$GITHUB_ENV"
              echo "Scheduled mode: RESOURCE & OPPORTUNITY ENRICHMENT"
            fi
          fi

      - name: Validate Python syntax
        run: python -m py_compile scraper.py

      - name: Run Scraper & Gemini AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          RESOURCE_ENRICH_LIMIT="${RESOURCE_ENRICH_LIMIT:-2}"
          echo "Running scraper with CRAWL_MODE=$CRAWL_MODE_INPUT, RESOURCE_ENRICH_LIMIT=$RESOURCE_ENRICH_LIMIT"
          CRAWL_MODE="$CRAWL_MODE_INPUT" RESOURCE_ENRICH_LIMIT="$RESOURCE_ENRICH_LIMIT" python scraper.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add data.json history.json resume.json || true

          if git diff --staged --quiet; then
            echo "No new data to commit."
          else
            git commit -m "ICH Update: alternating discovery & resource intelligence [skip ci]"

            # Another workflow/manual edit can update main while this job is running.
            # Rebase our generated commit on the latest remote main before pushing.
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                echo "Push succeeded on attempt $attempt."
                exit 0
              fi

              echo "Push rejected; rebasing on latest origin/main (attempt $attempt)."
              git fetch origin main
              git rebase origin/main || {
                echo "Rebase conflict detected. The generated changes cannot be auto-merged safely."
                git rebase --abort || true
                exit 1
              }
            done

            echo "Push failed after 3 attempts."
            exit 1
          fi
