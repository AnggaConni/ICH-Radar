name: ICH Shared Heritage Auto-Crawler

on:
  schedule:
    # Runs every 2 days to prioritize fixing INCOMPLETE data, then discovers new data
    - cron: "0 0 */2 * *"
  workflow_dispatch:
    inputs:
      crawl_mode:
        description: 'Choose what to run'
        required: true
        default: 'data_only'
        type: choice
        options:
          - 'data_only'
          - 'resume_only'
          - 'both'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-scraper-and-ai:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Scraper & Gemini AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CRAWL_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.crawl_mode || 'data_only' }}
        run: python scraper.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add data.json history.json resume.json || true

          if git diff --staged --quiet; then
            echo "No new data to commit."
          else
            git commit -m "ICH Update: Enriched incomplete data & discovered new heritage [skip ci]"

            # Another workflow/manual edit can update main while this job is running.
            # Rebase our generated commit on the latest remote main before pushing.
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                echo "Push succeeded on attempt $attempt."
                exit 0
              fi

              echo "Push rejected; rebasing on latest origin/main (attempt $attempt)."
              git fetch origin main
              git rebase origin/main || {
                echo "Rebase conflict detected. The generated changes cannot be auto-merged safely."
                git rebase --abort || true
                exit 1
              }
            done

            echo "Push failed after 3 attempts."
            exit 1
          fi
