name: ICH-Radar Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: python -m pip install requests
      - name: Compile Python modules
        run: python -m py_compile scraper.py free_discovery.py web_search_discovery.py test_free_discovery.py test_web_search_discovery.py resource_intelligence.py
      - name: Run offline tests
        run: python -m unittest -v test_free_discovery.py test_web_search_discovery.py
