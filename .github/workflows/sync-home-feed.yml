name: Sync homepage feed

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build homepage feed
        run: python scripts/sync_home_feed.py

      - name: Commit feed changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-feed.json
          if git diff --cached --quiet; then
            echo "No feed changes."
          else
            git commit -m "Sync homepage feed"
            git push
          fi
